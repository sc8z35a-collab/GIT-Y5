name: RK T4 Rev 5.0 EVT Hardware CI (ERC + KiCad 9 Sch/PCB DRC + PDN + DTS + 3D CAD)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reroute:
        description: 'Re-run full 14L HDI & 8L RF routing from scratch inside KiCad 9 container'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  erc-pdn-dts-timing-audit:
    name: 1. Real-Silicon ERC, PDN IR-Drop, DTS & High-Speed Timing Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Rev 5.0 Real-Silicon ERC, 80-Pin 3D BTB Mating & Dead-Battery 5V Boot Audit
        run: |
          node hardware/verify_erc.mjs
      - name: Run Real-Copper 16-Rail PDN DC IR-Drop & IPC-2152 Thermal Audit (0.5oz Inner / 1oz Outer + OLED PMIC)
        run: |
          node hardware/verify_pdn_ir_drop.mjs
      - name: Validate Pin-Accurate Linux Device Tree (RK3588S2)
        run: |
          node hardware/generate_dts.mjs
          node -e '
            const fs = require("fs");
            const dts = fs.readFileSync("firmware/rk3588s2-rk-t4-evt.dts", "utf8");
            let depth = 0, minDepth = 0;
            for (const ch of dts) {
              if (ch === "{") depth++;
              else if (ch === "}") { depth--; if (depth < minDepth) minDepth = depth; }
            }
            if (depth !== 0 || minDepth < 0) { console.error("DTS braces unbalanced!"); process.exit(1); }
            for (const bus of ["&i2c0","&i2c1","&i2c2","&i2c3","&i2c4","&i2c5","&i2c6","&i2c7","&pcie2x1l1","&uart9","&uart6","&uart3","&i2s0_8ch","&i2s1_8ch","&i2s2_2ch","&spi0","&spi2","&spi3"]) {
              if (!dts.includes(bus)) { console.error("Missing DTS node:", bus); process.exit(1); }
            }
            console.log("DTS structural & peripheral audit PASSED:", dts.split("\n").length, "lines.");
          '
      - name: Audit High-Speed Timing Closure Report (Rockchip RK3588S2 / JEDEC / Fiber Weave Gate)
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("hardware/length_match_report.json", "utf8"));
            let md = "### High-Speed Timing Closure (Rev 5.0 EVT — Rockchip RK3588S2 / JEDEC / Spread-Glass 1067/1078 Gate)\n\n";
            md += "| Group | Type | Routed | Min (mm) | Max (mm) | Skew (mm) | Skew (ps) | Limit | Status |\n|---|---|---:|---:|---:|---:|---:|---:|---|\n";
            let worstByte = 0, worstCa = 0, worstEmmc = 0, worstEmmcMaxMm = 0, worstPair = 0;
            const failures = [];
            for (const g of r.groups) {
              if (g.routedCount !== g.netCount) failures.push(`${g.group}: routed ${g.routedCount}/${g.netCount}`);
              if (g.type === "LPDDR5X-Byte") {
                worstByte = Math.max(worstByte, g.afterSkewPs);
                const pass = g.afterSkewPs <= 16.8;
                if (!pass) failures.push(`${g.group}: ${g.afterSkewPs}ps > 16.8ps`);
                md += `| ${g.group} | ${g.type} | ${g.routedCount}/${g.netCount} | ${g.afterMinMm} | ${g.afterMaxMm} | ${g.afterSkewMm} | **${g.afterSkewPs}** | <=16.8ps | ${pass ? "PASS" : "FAIL"} |\n`;
              } else if (g.type === "LPDDR5X-CA") {
                worstCa = Math.max(worstCa, g.afterSkewPs);
                const pass = g.afterSkewPs <= 25.0;
                if (!pass) failures.push(`${g.group}: ${g.afterSkewPs}ps > 25.0ps`);
                md += `| ${g.group} | ${g.type} | ${g.routedCount}/${g.netCount} | ${g.afterMinMm} | ${g.afterMaxMm} | ${g.afterSkewMm} | **${g.afterSkewPs}** | <=25.0ps | ${pass ? "PASS" : "FAIL"} |\n`;
              } else if (g.type === "eMMC-5.1") {
                worstEmmc = Math.max(worstEmmc, g.afterSkewPs);
                worstEmmcMaxMm = Math.max(worstEmmcMaxMm, g.afterMaxMm);
                const pass = g.afterSkewPs <= 5.0 && g.afterMaxMm <= 55.0;
                if (g.afterSkewPs > 5.0) failures.push(`${g.group}: skew ${g.afterSkewPs}ps > 5.0ps`);
                if (g.afterMaxMm > 55.0) failures.push(`${g.group}: abs length ${g.afterMaxMm}mm > 55.0mm`);
                md += `| ${g.group} | ${g.type} | ${g.routedCount}/${g.netCount} | ${g.afterMinMm} | **${g.afterMaxMm}** | ${g.afterSkewMm} | **${g.afterSkewPs}** | <=5.0ps & <=55mm | ${pass ? "PASS" : "FAIL"} |\n`;
              } else {
                worstPair = Math.max(worstPair, g.afterSkewPs);
                if (g.afterSkewPs > 1.0) failures.push(`${g.group}: ${g.afterSkewPs}ps > 1.0ps`);
              }
            }
            if (!r.fiberWeaveMitigation || !/1067|1078/.test(JSON.stringify(r.fiberWeaveMitigation))) {
              failures.push("Missing Spread-Glass 1067/1078 Fiber Weave Effect mitigation spec in length_match_report.json");
            }
            if (!r.lpddr5xPackagePinDelay || !r.lpddr5xPackagePinDelay.status) {
              failures.push("Missing LPDDR5X package pin-delay budget verification in length_match_report.json");
            }
            md += `\n**Worst Byte Skew:** ${worstByte.toFixed(2)} ps (<=16.8) | **Worst CA/CK Skew:** ${worstCa.toFixed(2)} ps (<=25.0) | **eMMC HS400:** ${worstEmmcMaxMm.toFixed(2)} mm (<=55.0 mm) / ${worstEmmc.toFixed(2)} ps (<=5.0 ps) | **Worst Diff-Pair:** ${worstPair.toFixed(2)} ps (<=1.0)\n`;
            md += `**Fiber Weave Mitigation:** ${r.fiberWeaveMitigation?.glassStyle || "N/A"} | **LPDDR5X Package Pin-Delay Budget:** ${r.lpddr5xPackagePinDelay?.status || "N/A"}\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(md);
            if (failures.length > 0) {
              console.error("TIMING GATE FAILED:", failures);
              process.exit(1);
            }
          '

  kicad9-native-sch-pcb-drc-and-mfg:
    name: 2. KiCad 9 Native Sch ERC, PCB DRC (--schematic-parity) & Gerber/Drill Export (14L HDI + 8L RF)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js 24 LTS inside KiCad 9 Container
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gnupg
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y -qq nodejs
          node -v
          kicad-cli --version
      - name: Strict Native KiCad 9 Schematic ERC (Mainboard Hierarchical + Mezzanine)
        run: |
          kicad-cli sch erc --format json --severity-all --exit-code-violations --output hardware/kicad_main_sch_erc.json hardware/rk_t4_mainboard.kicad_sch
          kicad-cli sch erc --format json --severity-all --exit-code-violations --output hardware/kicad_mezz_sch_erc.json hardware/rk_t4_mezzanine.kicad_sch
      - name: Optional Full From-Scratch Re-Routing (14L HDI + 8L RF)
        if: ${{ github.event.inputs.reroute == 'true' }}
        run: |
          node hardware/route_hdi_rev4.mjs
          node hardware/route_mezzanine_rf.mjs
      - name: Strict Native KiCad 9 PCB DRC (--schematic-parity), Zone Island-Removal Audit & Manufacturing Export
        run: |
          node hardware/export_mfg.mjs
          python3 -c '
          import pcbnew, sys
          for path in ["hardware/rk_t4_mainboard.kicad_pcb", "hardware/rk_t4_mezzanine.kicad_pcb"]:
              b = pcbnew.LoadBoard(path)
              zones = list(b.Zones())
              bad = [z.GetNetname() for z in zones if z.GetIslandRemovalMode() != pcbnew.ISLAND_REMOVAL_MODE_ALWAYS]
              print(f"{path}: {len(zones)} copper zones verified ISLAND_REMOVAL_MODE_ALWAYS (0 = remove all floating islands), bad={len(bad)}")
              if bad:
                  sys.exit(f"Zone island removal mode error on {path}: {bad}")
          '
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("hardware/kicad_drc_report.json", "utf8"));
            const z = JSON.parse(fs.readFileSync("hardware/kicad_mezz_drc_report.json", "utf8"));
            const ms = JSON.parse(fs.readFileSync("hardware/kicad_main_sch_erc.json", "utf8"));
            const zs = JSON.parse(fs.readFileSync("hardware/kicad_mezz_sch_erc.json", "utf8"));
            const mainSchViol = (ms.sheets || []).reduce((a, s) => a + (s.violations || []).length, 0);
            const mezzSchViol = (zs.sheets || []).reduce((a, s) => a + (s.violations || []).length, 0);
            const mParity = (m.schematic_parity || []).length;
            const zParity = (z.schematic_parity || []).length;
            const mIso = (m.violations || []).filter((v) => v.type === "isolated_copper").length;
            const zIso = (z.violations || []).filter((v) => v.type === "isolated_copper").length;
            const summary = [
              "### Official KiCad 9 Native Verification Results (`--severity-all --all-track-errors --schematic-parity`)",
              `- **Mainboard Hierarchical Schematic ERC:** violations=${mainSchViol}`,
              `- **Mezzanine Schematic ERC:** violations=${mezzSchViol}`,
              `- **Mainboard PCB DRC (14L 1.20mm 0.5oz Inner / 1oz Outer HDI):** violations=${m.violations.length}, unconnected=${m.unconnected_items.length}, schematic_parity=${mParity}, isolated_copper=${mIso}`,
              `- **Mezzanine PCB DRC (8L 0.80mm JLC08081H-1080A RF):** violations=${z.violations.length}, unconnected=${z.unconnected_items.length}, schematic_parity=${zParity}, isolated_copper=${zIso}`,
            ].join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(summary);
            if (mainSchViol || mezzSchViol || m.violations.length || m.unconnected_items.length || mParity || mIso || z.violations.length || z.unconnected_items.length || zParity || zIso) {
              process.exit(1);
            }
          '
      - name: Upload Verified Rev 5.0 EVT Manufacturing Package & Reports
        uses: actions/upload-artifact@v4
        with:
          name: rk-t4-rev5-evt-manufacturing-package
          path: |
            hardware/kicad_drc_report.json
            hardware/kicad_mezz_drc_report.json
            hardware/kicad_main_sch_erc.json
            hardware/kicad_mezz_sch_erc.json
            hardware/pdn_ir_drop_report.json
            hardware/length_match_report.json
            hardware/mezzanine_rf_report.json
            firmware/rk3588s2-rk-t4-evt.dts
            hardware/mfg/rk_t4_mainboard_gerbers.zip
            hardware/mfg/rk_t4_mezzanine_gerbers.zip
            hardware/mfg/rk_t4_bom_jlcpcb.csv
            hardware/mfg/rk_t4_cpl_jlcpcb.csv
            hardware/mfg/rk_t4_mezz_bom_jlcpcb.csv
            hardware/mfg/rk_t4_mezz_cpl_jlcpcb.csv

  cad-3d-interference-audit:
    name: 3. 3D CAD Build & Zero-Interference Box3 Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies & Build Single-File 3D Viewer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Run Headless Chromium 3D Box3 Interference & Anti-Squash Audit
        run: |
          CHROME_BIN=$(which google-chrome || which chromium || which chromium-browser || true)
          if [ -z "$CHROME_BIN" ]; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
            sudo apt-get update -qq && sudo apt-get install -y -qq /tmp/chrome.deb
            CHROME_BIN=$(which google-chrome || which chromium || which chromium-browser)
          fi
          export CHROME_BIN
          "$CHROME_BIN" --version
          node hardware/check_3d_intersections.mjs "file://${PWD}/index.html"
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("hardware/3d_interference_report.json", "utf8"));
            const md = [
              "### 3D CAD Box3 Physical Clearance Audit (Rev 5.0 EVT)",
              `- **Body Thickness:** ${r.bodyThicknessMm} mm (w/ Camera: ${r.maxThicknessWithCameraMm} mm)`,
              `- **Meshes Checked:** ${r.totalCheckedMeshes} (0 excluded)`,
              `- **Physical Interferences (>5 µm):** **${r.interferenceCount}**`,
              `- **6000mAh Si-C Battery Density:** ${r.physicalChecks.batteryImpliedWhPerL} Wh/L (${r.physicalChecks.batteryRealisticSiC ? "PASS <= 860 Wh/L" : "FAIL"})`,
            ].join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            if (r.interferenceCount !== 0 || !r.physicalChecks.batteryRealisticSiC) process.exit(1);
          '
