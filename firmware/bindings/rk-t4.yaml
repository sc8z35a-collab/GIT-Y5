%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/rockchip/rk-t4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RK T4 Flagship Smartphone (Rockchip RK3588S2) Board Binding

maintainers:
  - RK Hardware Engineering <hw-evt@rk-t4.local>

description: |
  Board-level Devicetree root binding for the RK T4 Flagship Smartphone
  Rev 5.0 EVT platform powered by the Rockchip RK3588S2 SoC.
  Peripheral bindings (PMIC, regulators, I2C/SPI/I2S/UART/PCIe/USB/Camera/Display)
  MUST conform to upstream Linux Documentation/devicetree/bindings/ schemas;
  non-mainline peripheral compatibles are intentionally NOT whitelisted here.

properties:
  $nodename:
    const: '/'
  compatible:
    items:
      - const: rk,t4-evt-rev5
      - const: rockchip,rk3588s

additionalProperties: true
...
